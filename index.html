<title>A little place to rest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');
:root{--paper:#fbf4eb;--cream:#f5e9dc;--rose:#d99a9b;--rose2:#edc5bf;--ink:#51443e;--muted:#8d7b71;--green:#87977b;--deepgreen:#586b59;--gold:#d9b77f;--line:rgba(103,79,67,.17);--shadow:0 22px 60px rgba(94,67,52,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #b8797b;outline-offset:4px}.serif{font-family:'Playfair Display',serif}.eyebrow{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.section{padding:100px 7vw;position:relative}.section-inner{max-width:1100px;margin:auto}.section-head{text-align:center;max-width:650px;margin:0 auto 48px}.section-head h2{font:500 clamp(2.2rem,5vw,3.5rem)/1.08 'Playfair Display',serif;margin:12px 0}.section-head p{color:var(--muted);line-height:1.8;margin:12px auto 0;max-width:480px}.btn{border:1px solid rgba(95,73,61,.25);border-radius:999px;background:#fff9f2;padding:13px 22px;cursor:pointer;transition:.25s;letter-spacing:.03em}.btn:hover{transform:translateY(-2px);background:#fff}.btn.primary{background:#745d53;color:#fff9f2;border-color:#745d53}.btn.primary:hover{background:#5f4a42}.tiny-note{font-size:.76rem;color:var(--muted)}

/* room */
#room{min-height:780px;background:#e9d9ca;overflow:hidden;padding-top:78px;padding-bottom:70px}.room-scene{height:510px;position:relative;max-width:1100px;margin:auto;background:linear-gradient(180deg,#e8d9ce 0 67%,#c4a995 67% 100%);border:10px solid #f8eee4;box-shadow:var(--shadow);overflow:hidden}.room-wallpaper{position:absolute;inset:0;background-image:radial-gradient(rgba(112,82,65,.12) .7px,transparent .7px);background-size:13px 13px;opacity:.4}.window{position:absolute;left:9%;top:9%;width:26%;height:43%;border:9px solid #f8eee4;background:linear-gradient(#d4e0df,#f1d9c2);box-shadow:inset 0 0 0 2px #b79b89}.window:before{content:"";position:absolute;left:50%;height:100%;width:6px;background:#f8eee4}.window:after{content:"";position:absolute;top:50%;width:100%;height:6px;background:#f8eee4}.curtain{position:absolute;top:-5px;left:-14px;width:20px;height:110%;background:#c78e8b;clip-path:polygon(0 0,100% 0,80% 100%,0 95%)}.curtain.right{left:auto;right:-14px;transform:scaleX(-1)}.sunlight{position:absolute;left:35%;top:22%;width:26%;height:40%;background:linear-gradient(110deg,rgba(255,237,195,.4),transparent);clip-path:polygon(0 0,100% 15%,100% 100%,25% 100%)}.picture{position:absolute;right:17%;top:12%;width:100px;height:118px;background:#f7eee1;border:7px solid #fff9ef;box-shadow:0 5px 10px #8e75654a;display:grid;place-items:center}.picture svg{width:76px}.shelf{position:absolute;right:8%;top:39%;width:27%;height:12px;background:#a77f68;box-shadow:0 7px 0 #8e6c5b}.shelf:before,.shelf:after{content:"";position:absolute;bottom:12px;width:30px;height:45px;background:#a9b39b;border-radius:40% 40% 5px 5px}.shelf:before{left:20px}.shelf:after{right:25px;background:#d8a19a}.lamp{position:absolute;right:19%;bottom:22%;width:85px;height:180px}.lamp .shade{position:absolute;top:0;left:5px;width:76px;height:55px;background:#e5c58f;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);filter:drop-shadow(0 4px 4px #775f4b44)}.lamp .stem{position:absolute;top:52px;left:39px;width:8px;height:105px;background:#9c7964}.lamp .base{position:absolute;bottom:0;left:17px;width:52px;height:12px;border-radius:50%;background:#9c7964}.lamp-glow{position:absolute;right:7%;bottom:18%;width:230px;height:250px;background:radial-gradient(ellipse,rgba(255,224,160,.38),transparent 70%);pointer-events:none}.rug{position:absolute;bottom:5%;left:20%;width:56%;height:22%;background:#b77f78;border-radius:50%;opacity:.6;transform:rotate(-3deg)}.sofa{position:absolute;bottom:13%;left:30%;width:38%;height:33%;background:#b9877f;border-radius:30px 30px 12px 12px;box-shadow:inset 0 -12px 0 #9f716c}.sofa:before{content:"";position:absolute;left:-18px;top:28px;width:45px;height:92px;background:#a97872;border-radius:18px}.sofa:after{content:"";position:absolute;right:-18px;top:28px;width:45px;height:92px;background:#a97872;border-radius:18px}.cushion{position:absolute;left:35%;bottom:24%;width:90px;height:75px;background:#e5c4a9;border-radius:16px;transform:rotate(-8deg);z-index:2}.throw{position:absolute;right:31%;bottom:17%;width:100px;height:85px;background:#d5b5a2;border-radius:40% 10% 20% 20%;z-index:2}.table{position:absolute;right:7%;bottom:7%;width:17%;height:13%;background:#9d735d;border-radius:50% 50% 6px 6px}.table:before{content:"";position:absolute;left:48%;top:35px;width:8px;height:60px;background:#89644f}.book{position:absolute;left:14%;bottom:14%;width:95px;height:14px;background:#d7b78b;transform:rotate(-9deg);box-shadow:0 5px 0 #9f7c67}.room-caption{position:absolute;left:5%;bottom:5%;font:italic 1.05rem 'Playfair Display',serif;color:#6d5b50}.room-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.music-panel{max-width:500px;margin:30px auto 0;text-align:center;padding:22px;border:1px solid var(--line);background:rgba(255,250,243,.7)}.music-panel h3{font:500 1.5rem 'Playfair Display',serif;margin:4px 0 12px}.music-panel iframe{width:100%;height:150px;border:0;border-radius:10px}.music-panel .tiny-note{margin:10px 0 0 #letters{background:#f7eee4}.envelopes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:850px;margin:auto}.envelope{height:190px;position:relative;border:0;background:transparent;cursor:pointer;perspective:700px}.env-paper{position:absolute;inset:15px 7px 5px;background:#e7c9b8;box-shadow:0 10px 22px #80655520;border-radius:3px}.env-paper:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,transparent 49.5%,#d6ad9e 50%),linear-gradient(220deg,transparent 49.5%,#dcb7a9 50%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.env-flap{position:absolute;left:7px;right:7px;top:15px;height:100px;background:#f0d9ca;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;filter:drop-shadow(0 2px 1px #7d5c4b22)}.seal{position:absolute;left:50%;top:85px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#b8797a;color:#fff;display:grid;place-items:center;font:500 1rem 'Playfair Display',serif}.env-label{position:absolute;bottom:20px;left:0;right:0;font:italic 1.12rem 'Playfair Display',serif;color:#6e5148}.envelope:hover .env-flap{transform:rotateX(18deg)}.envelope small{display:block;margin-top:4px;font: .68rem 'DM Sans',sans-serif;color:#967c6e}.letter-modal{position:fixed;inset:0;background:rgba(54,42,37,.55);z-index:20;display:none;place-items:center;padding:20px}.letter-modal.show{display:grid}.letter-card{position:relative;width:min(460px,100%);min-height:280px;padding:52px 35px 35px;background:#fff8ed;box-shadow:0 30px 80px #21140f44;text-align:center;border:1px solid #e8d7c6}.letter-card:before{content:"";position:absolute;inset:10px;border:1px solid #e7d4c4;pointer-events:none}.letter-card h3{font:500 2rem 'Playfair Display',serif;margin:0 0 14px}.letter-card p{color:#8b786d;line-height:1.8}.close-modal{position:absolute;right:18px;top:14px;border:0;background:transparent;font-size:1.4rem;cursor:pointer}
/* garden */
#garden{background:#e9eee2;overflow:hidden}.garden-ground{position:relative;min-height:390px;border-radius:48% 48% 0 0/15% 15% 0 0;background:linear-gradient(180deg,#dce7d2,#a6b998);padding:72px 30px 30px;display:flex;align-items:end;justify-content:center;gap:clamp(20px,6vw,80px);overflow:hidden}.garden-ground:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#f8f1df 1px,transparent 1px);background-size:26px 26px;opacity:.32}.flower-bed{position:relative;z-index:1;width:120px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:end}.flower-svg{width:120px;height:190px;overflow:visible}.stem{stroke:#58745b;stroke-width:5;fill:none;stroke-linecap:round}.leaf{fill:#7f9b76;stroke:#58745b;stroke-width:1.4}.petal{fill:#f2c8c2;stroke:#c98f8d;stroke-width:1.5;transform-box:fill-box;transform-origin:center bottom;transition:transform 1s,fill 1s}.flower-bed.tulip .petal{fill:#d88f91;stroke:#a96c72}.flower-bed .bud{transform:scale(.25);opacity:.35;transform-origin:60px 58px;transition:all 1s}.flower-bed.bloomed .bud{transform:scale(1);opacity:1}.flower-bed.bloomed .petal{fill:#f7d9d0}.flower-bed.tulip.bloomed .petal{fill:#e5a0a0}.flower-bed .petal:nth-child(2){transition-delay:.1s}.flower-bed .petal:nth-child(3){transition-delay:.2s}.flower-bed .petal:nth-child(4){transition-delay:.3s}.flower-bed .petal:nth-child(5){transition-delay:.4s}.flower-bed .label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#51664f;margin-top:8px}.water-btn{display:block;margin:26px auto 0}.water-btn:disabled{opacity:.45;cursor:default;transform:none}.water-count{text-align:center;color:#6e8068;font-size:.8rem;margin-top:12px}.butterfly{position:absolute;width:28px;height:22px;opacity:0;pointer-events:none;z-index:2}.butterfly.show{opacity:1;animation:fly 7s ease-in-out infinite alternate}.butterfly:before,.butterfly:after{content:"";position:absolute;width:14px;height:19px;background:#f4d6a7;border-radius:90% 10% 80% 20%;transform-origin:100% 80%;animation:flap .28s ease-in-out infinite alternate}.butterfly:after{left:13px;transform:scaleX(-1);background:#e6a9a4}@keyframes flap{to{transform:scaleY(.55) rotate(15deg)}}@keyframes fly{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(80px,-45px) rotate(12deg)}100%{transform:translate(150px,10px) rotate(-6deg)}}.bloom-message{max-width:560px;text-align:center;margin:24px auto 0;color:#62745e;line-height:1.7;opacity:0;transition:opacity .7s}.bloom-message.show{opacity:1}

/* Unified pink, cream, sage and gold design */
:root{--paper:#fff6f3;--cream:#fffaf1;--rose:#d995a2;--rose2:#f2cbd0;--ink:#5b4248;--muted:#987c7e;--green:#a9b99d;--deepgreen:#71856b;--gold:#dfbf82;--line:rgba(163,112,120,.2);--shadow:0 22px 55px rgba(143,93,102,.14);--content-width:1060px;--section-gutter:clamp(18px,5vw,68px)}
html{scroll-padding-top:22px}
body{min-width:320px;background:#fff7f4;color:#5b4248}
body.modal-open{overflow:hidden}
.section{padding:clamp(64px,7vw,92px) var(--section-gutter);scroll-margin-top:16px}

.btn{min-height:48px;border-radius:9px;border-color:#d7a0a8;background:#fff7f4;color:#704e56;box-shadow:0 4px 12px rgba(161,102,113,.1);transition:transform .22s ease,background .22s ease,box-shadow .22s ease}

.btn.primary:hover{background:#c98190;border-color:#c98190}

#welcome{min-height:100svh;padding:clamp(22px,5vw,54px);background:radial-gradient(ellipse at 50% 30%,#fffaf5 0%,#f9e2e4 57%,#f2d1d5 100%)}
#welcome:before,#welcome:after{border-color:rgba(190,132,142,.2)}
.welcome-card{width:min(100%,620px);padding:clamp(42px,7vw,64px) clamp(22px,5vw,48px);border:1px solid rgba(190,132,142,.34);border-radius:5px;background:rgba(255,250,246,.9);box-shadow:0 18px 55px rgba(170,111,123,.16)}

#room{min-height:0;padding-top:clamp(64px,7vw,92px);padding-bottom:clamp(64px,7vw,92px);background:linear-gradient(180deg,#f8e5e3 0%,#f3dcd8 100%)}
.room-scene{width:100%;height:clamp(340px,45vw,500px);border:9px solid #fff8f1;border-radius:8px;outline:1px solid rgba(190,132,142,.25);background:linear-gradient(180deg,#f2d9d5 0 67%,#d8bcae 67% 100%);box-shadow:0 20px 52px rgba(151,97,91,.16)}

.window:before,.window:after{background:#fff6ee}
.curtain{background:#d99aa5}
.picture{background:#fff8ef;border-color:#fffdf7;box-shadow:0 5px 10px rgba(129,93,85,.13)}
.shelf{background:#b88a78;box-shadow:0 7px 0 #9e7568}
.shelf:before{background:#a9bd9c}
.shelf:after{background:#e4aeb4}
.lamp .shade{background:#e8cc94}

.rug{background:#aebd9d;opacity:.72}
.sofa{background:#d99ca5;box-shadow:inset 0 -12px 0 #c7838d,0 14px 24px rgba(130,79,82,.12)}

.cushion{background:#f8e6d4}
.throw{background:#e9bbc0}
.table{background:#b48670}

.book{background:#e5c58d;box-shadow:0 5px 0 #b08a67}

.music-panel{width:min(100%,520px);margin:30px auto 0;padding:clamp(18px,3vw,24px);border:1px solid rgba(200,143,151,.33);border-radius:8px;background:#fff8f3;box-shadow:0 12px 30px rgba(151,97,91,.08)}

.music-panel.is-focused{animation:musicFocus .9s ease}
@keyframes musicFocus{0%,100%{box-shadow:0 12px 30px rgba(151,97,91,.08)}35%{box-shadow:0 0 0 5px rgba(217,149,162,.2),0 18px 38px rgba(151,97,91,.12)}}
#letters{background:linear-gradient(180deg,#fff8f2 0%,#fbe9e5 100%)}
.envelopes{width:min(100%,850px);grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,3vw,28px)}
.envelope{width:100%;max-width:260px;filter:drop-shadow(0 9px 10px rgba(159,100,109,.1))}

.env-paper{background:#f0cbd0;box-shadow:0 10px 22px rgba(159,100,109,.13)}
.env-paper:before{background:linear-gradient(140deg,transparent 49.5%,#e4b5bd 50%),linear-gradient(220deg,transparent 49.5%,#e9c0c6 50%)}

.letter-modal{background:rgba(88,57,63,.5);backdrop-filter:blur(5px)}

#garden{background:linear-gradient(180deg,#f5f4e9 0%,#e9efdf 100%)}
.garden-ground{width:100%;min-height:390px;padding:64px clamp(14px,4vw,38px) 30px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;justify-items:center;column-gap:clamp(8px,2.5vw,28px);border:1px solid rgba(114,143,105,.2);border-radius:48% 48% 4px 4px/15% 15% 4px 4px;background:linear-gradient(180deg,#e6eedc 0%,#c5d5b8 70%,#a9c095 100%);box-shadow:inset 0 12px 30px rgba(255,255,255,.32)}
.garden-ground:before{background-image:radial-gradient(rgba(255,250,237,.85) 1px,transparent 1px);opacity:.38}

.stem{stroke:#718c69}

.flower-bed.tulip.bloomed .petal{fill:#efaeb8}
.flower-bed .label{color:#657f60;font-weight:600;letter-spacing:.14em}
.water-btn{min-width:190px;margin:28px auto 0;box-shadow:0 8px 18px rgba(113,143,105,.18)}
.water-count{min-height:1.5em;color:#71856b;font-variant-numeric:tabular-nums}
.butterfly:before{background:#f3dcae}
.butterfly:after{background:#e8aeb7}
#together{padding-top:clamp(64px,7vw,92px);padding-bottom:clamp(64px,7vw,92px);background:linear-gradient(180deg,#fae9e6 0%,#f5dedb 100%)}
.final-stage{width:100%;min-height:clamp(320px,40vw,440px);grid-template-columns:minmax(0,1.65fr) minmax(0,.9fr);border:9px solid #fff8f1;border-radius:8px;background:radial-gradient(ellipse at 50% 60%,#fffaf3 0%,#f9e5dd 72%,#efcfca 100%);box-shadow:0 22px 55px rgba(143,93,102,.14)}
.final-stage:before,.final-stage:after{background:rgba(200,151,145,.3)}
.final-garden-glow{background:radial-gradient(ellipse,rgba(169,190,151,.4),transparent 70%)}
.art-slot{border:0;background:transparent;backdrop-filter:none}
.art-slot img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom}
.peanuts-slot img{max-height:360px}
.avatar-slot img{max-height:300px}
.woodstock-slot{position:absolute;top:9%;right:13%;width:clamp(58px,10vw,100px);height:clamp(48px,8vw,76px);min-height:0;margin:0;animation:woodstockFloat 4.5s ease-in-out infinite}
@media(max-width:700px){
 .section{padding:62px 20px}.room-scene{height:clamp(350px,66vw,420px)}
 .window{left:6%;width:32%;height:37%}.picture{right:8%;width:72px;height:88px}.shelf{right:5%;width:30%}
 .sofa{left:19%;width:52%;height:29%}.cushion{left:24%;bottom:21%;width:65px}.throw{right:20%;bottom:16%;width:75px}
 .lamp{right:7%;bottom:20%;transform:scale(.8);transform-origin:bottom}.table{right:3%;width:17%}
 .room-controls{max-width:440px}.room-controls .btn{flex:1 1 145px;min-width:0}
 .envelopes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.envelope{max-width:230px;height:168px}.envelope:last-child:nth-child(odd){grid-column:1/-1}
 .garden-ground{min-height:420px;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:4px;padding:48px 14px 20px;border-radius:34% 34% 4px 4px/8% 8% 4px 4px}
 .flower-bed{width:100%;max-width:118px;height:180px}.flower-svg{height:145px}
 .final-stage{min-height:300px;padding:54px 12px 22px;gap:8px}.peanuts-slot{min-height:190px}.avatar-slot{height:75%;min-height:145px}.woodstock-slot{top:7%;right:8%;width:66px;height:54px}
}
@media(max-width:420px){
 .section{padding-right:16px;padding-left:16px}.room-scene{height:360px}.room-controls .btn{flex-basis:100%}
 .envelopes{gap:8px}.envelope{height:150px}
 .garden-ground{min-height:390px;padding-top:40px}.flower-bed{height:164px}.flower-svg{height:128px}
 .final-stage{min-height:265px;padding:48px 8px 18px}.peanuts-slot{min-height:165px}.avatar-slot{min-height:126px}.woodstock-slot{width:54px;height:44px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="welcome">
 <div class="welcome-card">
  <div class="welcome-art"><div class="sun"></div><div class="hill"></div></div>
  
  
  
  <button class="btn primary" id="enterBtn">Come on in</button>
 </div>
</section>

<section class="section" id="room">
 <div class="section-inner">
  
  <div class="room-scene" aria-label="Illustrated cozy room with a window, sofa, lamp and side table">
   <div class="room-wallpaper"></div><div class="window"><div class="curtain"></div><div class="curtain right"></div></div><div class="sunlight"></div>
   <div class="picture"><svg viewBox="0 0 80 90" aria-hidden="true"><path d="M12 70 Q25 25 40 53 Q53 14 69 70" fill="none" stroke="#83957a" stroke-width="3"/><path d="M39 53 Q25 42 20 30 M40 52 Q55 40 60 27" fill="none" stroke="#83957a" stroke-width="2"/><circle cx="20" cy="30" r="5" fill="#d69b99"/><circle cx="60" cy="27" r="5" fill="#d69b99"/></svg></div>
   <div class="shelf"></div><div class="lamp-glow"></div><div class="lamp"><div class="shade"></div><div class="stem"></div><div class="base"></div></div>
   <div class="rug"></div><div class="sofa"></div><div class="cushion"></div><div class="throw"></div><div class="table"></div><div class="book"></div>
  </div>
  <div class="room-controls"><button class="btn" id="lampBtn" aria-pressed="false">Turn the lamp on</button><button class="btn" id="roomMusicBtn">Find the music</button><button class="btn" id="gardenJump">Visit the garden</button></div>
  <div class="music-panel" id="music">
   <h3>Sagip · Jan Roberts</h3>
   <iframe title="Sagip by Jan Roberts on Apple Music" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" height="150" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" src="https://embed.music.apple.com/us/song/sagip/1725956332"></iframe>
   
  </div>
 </div>
</section>

<section class="section" id="letters">
 <div class="section-inner">
  
  <div class="envelopes">
   <button class="envelope" data-letter="0" aria-label="Open first envelope"><span class="env-paper"></span><span class="env-flap"></span></button>
   <button class="envelope" data-letter="1" aria-label="Open second envelope"><span class="env-paper"></span><span class="env-flap"></span></button>
   <button class="envelope" data-letter="2" aria-label="Open third envelope"><span class="env-paper"></span><span class="env-flap"></span></button>
  </div>
 </div>
</section>
<div class="letter-modal" id="letterModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="letterTitle">
 <div class="letter-card"><button class="close-modal" id="closeModal" aria-label="Close">×</button><h3 id="letterTitle"></h3><p id="letterBody" aria-live="polite"></p></div>
</div>

<section class="section" id="garden">
 <div class="section-inner">
  
  <div class="garden-ground">
   <div class="butterfly" id="butterflyA"></div><div class="butterfly" id="butterflyB" style="left:18%;top:32%;animation-delay:-2s"></div>
   <div class="flower-bed lily" data-flower="lily"><svg class="flower-svg" viewBox="0 0 120 190" aria-label="Pink lily"><path class="stem" d="M60 175 Q56 120 60 77"/><path class="leaf" d="M59 135 Q17 103 19 135 Q39 153 59 135Z"/><path class="leaf" d="M60 116 Q99 87 102 112 Q83 133 60 116Z"/><g class="bud"><path class="petal" d="M60 70 Q24 32 45 12 Q60 19 60 70Z"/><path class="petal" d="M60 70 Q96 32 75 12 Q60 19 60 70Z"/><path class="petal" d="M60 70 Q15 65 29 38 Q49 35 60 70Z"/><path class="petal" d="M60 70 Q105 65 91 38 Q71 35 60 70Z"/><path class="petal" d="M60 70 Q42 1 60 3 Q78 1 60 70Z"/><circle cx="60" cy="49" r="5" fill="#c58b6c"/></g></svg><div class="label">lily</div></div>
   <div class="flower-bed tulip" data-flower="tulip"><svg class="flower-svg" viewBox="0 0 120 190" aria-label="Pink tulip"><path class="stem" d="M60 175 Q64 120 60 70"/><path class="leaf" d="M60 145 Q14 103 22 146 Q43 161 60 145Z"/><path class="leaf" d="M62 125 Q100 96 101 126 Q83 146 62 125Z"/><g class="bud"><path class="petal" d="M35 67 Q28 22 48 28 Q54 39 60 67Z"/><path class="petal" d="M60 67 Q54 14 70 23 Q79 40 60 67Z"/><path class="petal" d="M60 67 Q75 19 91 31 Q95 52 60 67Z"/><path class="petal" d="M35 67 Q60 83 91 67 Q76 96 60 85 Q44 96 35 67Z"/></g></svg><div class="label">tulip</div></div>
   <div class="flower-bed lily" data-flower="lily2"><svg class="flower-svg" viewBox="0 0 120 190" aria-label="Pink lily"><path class="stem" d="M60 175 Q55 120 60 77"/><path class="leaf" d="M59 135 Q17 103 19 135 Q39 153 59 135Z"/><path class="leaf" d="M60 116 Q99 87 102 112 Q83 133 60 116Z"/><g class="bud"><path class="petal" d="M60 70 Q24 32 45 12 Q60 19 60 70Z"/><path class="petal" d="M60 70 Q96 32 75 12 Q60 19 60 70Z"/><path class="petal" d="M60 70 Q15 65 29 38 Q49 35 60 70Z"/><path class="petal" d="M60 70 Q105 65 91 38 Q71 35 60 70Z"/><path class="petal" d="M60 70 Q42 1 60 3 Q78 1 60 70Z"/><circle cx="60" cy="49" r="5" fill="#c58b6c"/></g></svg><div class="label">lily</div></div>
   <div class="flower-bed tulip" data-flower="tulip2"><svg class="flower-svg" viewBox="0 0 120 190" aria-label="Pink tulip"><path class="stem" d="M60 175 Q64 120 60 70"/><path class="leaf" d="M60 145 Q14 103 22 146 Q43 161 60 145Z"/><path class="leaf" d="M62 125 Q100 96 101 126 Q83 146 62 125Z"/><g class="bud"><path class="petal" d="M35 67 Q28 22 48 28 Q54 39 60 67Z"/><path class="petal" d="M60 67 Q54 14 70 23 Q79 40 60 67Z"/><path class="petal" d="M60 67 Q75 19 91 31 Q95 52 60 67Z"/><path class="petal" d="M35 67 Q60 83 91 67 Q76 96 60 85 Q44 96 35 67Z"/></g></svg><div class="label">tulip</div></div>
  </div>
  <button class="btn primary water-btn" id="waterBtn">Water the flowers</button><div class="water-count" id="waterCount" aria-live="polite">0 / 4</div>
  
 </div>
</section>

<section class="section" id="together">
 <div class="section-inner">
  
  <div class="final-stage">
   <div class="final-garden-glow" aria-hidden="true"></div>
   <!-- Add your unchanged group artwork inside this position when you are ready. -->
   <div class="art-slot peanuts-slot" role="img" aria-label="Reserved position for the Peanuts friends group image"></div>
   <!-- Add your avatar image inside this position when you are ready. -->
   <div class="art-slot avatar-slot" role="img" aria-label="Reserved position for your avatar image"></div>
   <!-- Add your unchanged Woodstock image inside this position when you are ready. -->
   <div class="art-slot woodstock-slot" role="img" aria-label="Reserved position for the flying Woodstock image"></div>
  </div>
  
 </div>
</section>


<script>

const selectOne = (selector) => document.querySelector(selector);
const selectAll = (selector) => [...document.querySelectorAll(selector)];
const scrollToElement = (element, block = "start") => {
  if (element) element.scrollIntoView({ behavior: "smooth", block });
};

selectOne("#enterBtn")?.addEventListener("click", () => scrollToElement(selectOne("#room")));
selectOne("#gardenJump")?.addEventListener("click", () => scrollToElement(selectOne("#garden")));
selectOne("#roomMusicBtn")?.addEventListener("click", () => {
  const music = selectOne("#music");
  scrollToElement(music, "center");
  music?.classList.remove("is-focused");
  requestAnimationFrame(() => music?.classList.add("is-focused"));
});
selectOne("#backTop")?.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

const roomScene = selectOne(".room-scene");
const lampButton = selectOne("#lampBtn");
lampButton?.setAttribute("aria-pressed", "false");
lampButton?.addEventListener("click", () => {
  const isLit = roomScene?.classList.toggle("is-lit") ?? false;
  lampButton.setAttribute("aria-pressed", String(isLit));
  lampButton.textContent = isLit ? "Turn the lamp off" : "Turn the lamp on";
});

const modal = selectOne("#letterModal");
const modalTitle = selectOne("#letterTitle");
const modalBody = selectOne("#letterBody");
const closeButton = selectOne("#closeModal");
let activeEnvelope = null;

const closeLetter = () => {
  if (!modal?.classList.contains("show")) return;
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  activeEnvelope?.classList.remove("is-open");
  activeEnvelope?.focus();
  activeEnvelope = null;
};

selectAll(".envelope").forEach((envelope) => {
  envelope.addEventListener("click", () => {
    const index = Number(envelope.dataset.letter);
    if (!Number.isInteger(index) || !envelopeTitles[index] || !modal) return;
    activeEnvelope?.classList.remove("is-open");
    activeEnvelope = envelope;
    envelope.classList.add("is-open");
    modalTitle.textContent = "";
    modalBody.textContent = "";
    modal.setAttribute("aria-hidden", "false");
    modal.classList.add("show");
    document.body.classList.add("modal-open");
    closeButton?.focus();
  });
});

closeButton?.addEventListener("click", closeLetter);
modal?.addEventListener("click", (event) => {
  if (event.target === modal) closeLetter();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeLetter();
  if (event.key !== "Tab" || !modal?.classList.contains("show")) return;
  const focusable = [...modal.querySelectorAll("button,[href],[tabindex]:not([tabindex='-1'])")]
    .filter((element) => !element.disabled);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
});

let waterCount = 0;
const flowerBeds = selectAll(".flower-bed");
const waterButton = selectOne("#waterBtn");
const counter = selectOne("#waterCount");
const bloomMessage = selectOne("#bloomMessage");
waterButton?.setAttribute("aria-label", "Water the flowers");
counter?.setAttribute("aria-live", "polite");

waterButton?.addEventListener("click", () => {
  if (waterCount >= flowerBeds.length) return;
  const flower = flowerBeds[waterCount];
  flower.classList.add("bloomed");
  flower.setAttribute("aria-label", flower.dataset.flower + " bloomed");
  waterCount += 1;
  if (counter) counter.textContent = waterCount + " / " + flowerBeds.length;
  if (waterCount === 2) selectOne("#butterflyA")?.classList.add("show");
  if (waterCount === 3) selectOne("#butterflyB")?.classList.add("show");
  if (waterCount === flowerBeds.length) {
    if (waterButton) {
      waterButton.disabled = true;
      waterButton.setAttribute("aria-label", "The garden is blooming");
    }
  }
});

</script>
</body>
</html>
